name: Milestone 15 lockfile refresh

on:
  push:
    branches:
      - codex/milestone15-security-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/milestone15-security-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh lockfile for Next.js 16"
            git push origin HEAD:codex/milestone15-security-hardening
          fi
      - name: Install exact dependency graph
        run: npm ci
      - name: Production dependency audit
        run: npm run security:audit
      - name: Secret scan
        run: npm run security:scan
      - name: Production preflight
        run: npm run preflight:production
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
