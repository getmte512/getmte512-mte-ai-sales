name: Verify MTE CRM

on:
  pull_request:
  push:
    branches: [main, recovery/codex-full-history]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
      REVIEW_EVIDENCE_SIGNING_SECRET: ci-review-evidence-signing-secret-32chars
      REVIEW_EVIDENCE_SIGNING_KEY_ID: ci-primary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm run preflight:production
      - run: npm run config:production
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
