name: Production Closure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
      PRODUCTION_ADMIN_COOKIE: ${{ secrets.PRODUCTION_ADMIN_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production target
        run: |
          test -n "$NEXT_PUBLIC_APP_URL"
          test -n "$PRODUCTION_ADMIN_COOKIE"
          node -e 'const u=new URL(process.env.NEXT_PUBLIC_APP_URL); if(u.protocol!=="https:"||u.hostname==="localhost") process.exit(1)'
      - name: Run read-only production closure
        env:
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          PRODUCTION_ADMIN_COOKIE: ${{ secrets.PRODUCTION_ADMIN_COOKIE }}
        run: npm run closure:production
