name: Production Closure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MTE_PRODUCTION_URL: ${{ secrets.PRODUCTION_APP_URL }}
      MTE_PRODUCTION_COOKIE: ${{ secrets.PRODUCTION_ADMIN_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production target
        run: |
          test -n "$MTE_PRODUCTION_URL"
          test -n "$MTE_PRODUCTION_COOKIE"
          node -e 'const u=new URL(process.env.MTE_PRODUCTION_URL); if(u.protocol!=="https:"||u.hostname==="localhost"||u.hostname==="127.0.0.1") process.exit(1)'
      - name: Run read-only production closure
        run: npm run closure:production
